<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Interno - Registro de Pacientes</title>
    <link rel="stylesheet" href="../css/interno.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header id="header-container" data-include="interno-header.html"></header>

    <main class="container" style="max-width: 900px;">
        <div class="text-center" style="margin-bottom: 2.5rem;">
            <span class="badge-interno">USO EXCLUSIVO INTERNO</span>
            <h1 style="color: var(--primary);">Ficha de Ingreso Clínico</h1>
            <p style="color: var(--gray);">Complete los datos del paciente para la apertura de su historia clínica.</p>
        </div>

        <form action="#" method="POST"
            style="background: var(--white); padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">

            <h2
                style="font-size: 1.2rem; color: var(--secondary); margin-bottom: 1.5rem; border-bottom: 2px solid var(--light); padding-bottom: 0.5rem;">
                1. Datos Personales Básicos</h2>

            <div class="form-grid" style="margin-bottom: 2.5rem;">
                <div class="form-group">
                    <label for="nombre">Nombre(s)<span class="required-mark">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Carlos">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido(s)<span class="required-mark">*</span></label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Ej: Pérez">
                </div>

                <div class="form-group">
                    <label for="dni">Documento / Identificación<span class="required-mark">*</span></label>
                    <input type="text" id="dni" name="dni" required placeholder="Número de DNI, RUT o Cédula">
                </div>

                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento<span class="required-mark">*</span></label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono de Contacto<span class="required-mark">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej: +54 9 11 ...">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico <span
                            style="font-weight: normal; color: var(--gray); font-size: 0.85rem;">(Opcional)</span></label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>
            </div>

            <h2
                style="font-size: 1.2rem; color: var(--secondary); margin-bottom: 1.5rem; border-bottom: 2px solid var(--light); padding-bottom: 0.5rem;">
                2. Asignación Médica y Diagnóstico</h2>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="profesional">Profesional Médico a Cargo<span class="required-mark">*</span></label>
                    <select id="profesional" name="profesional" required>
                        <option value="" disabled selected>Seleccione el kinesiólogo / rehabilitador...</option>
                        <option value="dr_gomez">Lic. Mariano Gómez (Kinesiología Deportiva)</option>
                        <option value="dra_rodriguez">Lic. Patricia Rodríguez (Traumatología)</option>
                        <option value="dr_lopez">Lic. Walter López (Fisioterapia Avanzada)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="patologia">Patología / Diagnóstico de Ingreso<span
                            class="required-mark">*</span></label>
                    <textarea id="patologia" name="patologia" rows="4" required
                        placeholder="Describa la patología actual, síntomas reportados o diagnóstico derivado del médico derivante..."></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="tratamiento">Tratamiento e Indicaciones a Seguir<span
                            class="required-mark">*</span></label>
                    <textarea id="tratamiento" name="tratamiento" rows="4" required
                        placeholder="Plan de contingencia, número de sesiones estimadas, agentes físicos a aplicar y ejercicios terapéuticos..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                <button type="submit" class="btn">Guardar Ficha Clínica</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 KineVital - Sistema de Gestión Interna. Restringido para personal autorizado.</p>
    </footer>

    <script src="../js/header.js"></script>
</body>

</html>
