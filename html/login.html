<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container">
        <div class="login-card">
            <div class="text-center">
                <h1>KineVital</h1>
                <p>Portal Interno de Gestión</p>
            </div>
            
            <form action="home-interno.html" method="GET">
                <div class="form-group">
                    <label for="usuario">Usuario / Legajo</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej: admin123 o med_gomez">
                </div>
                
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn w-100">Iniciar Sesión</button>
            </form>

            <a href="../index.html" class="back-link">Volver al sitio público</a>
        </div>
    </main>
</body>
</html>
