<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KineVital - Registro de Usuario</title>
    <!-- Asegúrate de que esta ruta apunte correctamente a tu archivo CSS -->
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <!-------------------------------------------------------------->

    <!-- Contenedor principal con el mismo estilo del LogIn -->
    <main class="login-card" style="max-width: 500px;"> <!-- Se amplía ligeramente el ancho de 400px a 500px para acomodar mejor las dos columnas -->
        <div class="text-center">
            <h1 class="logo" style="margin-bottom: 0.5rem; display: block;">KineVital</h1>
            <p style="color: var(--gray); margin-bottom: 2rem; font-size: 0.95rem;">Portal Interno de Gestión - Registro de Personal</p>
        </div>

        <!-- Formulario de Registro -->
        <form action="paciente_perfil.html" method="GET">
            <!-- Bloque: Datos Personales -->
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" name="name" required placeholder="Ej: Juan Pérez">
            </div>

            <!-- Fila de dos columnas para DNI y Teléfono -->
            <div class="grid-2" style="gap: 1rem; margin-bottom: 1.2rem; align-items: flex-start;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="dni">DNI / Documento</label>
                    <input type="text" id="dni" name="dni" required placeholder="N° de documento">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="phone">Teléfono de Contacto</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ej: +54 9 ...">
                </div>
            </div>

            <!-- Bloque: Datos del Portal -->
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <!-- Fila de dos columnas para Usuario/Legajo y Fecha de Nacimiento -->
            <div class="grid-2" style="gap: 1rem; margin-bottom: 1.2rem; align-items: flex-start;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="username">Usuario / Legajo</label>
                    <input type="text" id="username" name="username" required placeholder="Ej: legajo123">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="birthdate">Fecha de Nacimiento</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>
            </div>

            <!-- Bloque: Credenciales de Acceso -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm_password" required placeholder="Repite tu contraseña">
            </div>

            <!-- Términos y Condiciones -->
            <div class="form-group" style="display: flex; gap: 0.5rem; align-items: center; margin-top: 1.5rem;">
                <input type="checkbox" id="terms" name="terms" required style="width: auto; cursor: pointer;">
                <label for="terms" style="font-weight: normal; margin-bottom: 0; font-size: 0.9rem; cursor: pointer;">
                    Acepto los <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">términos y políticas</a>
                </label>
            </div>

            <!-- Botón de Registro reutilizando los estilos del botón base -->
            <button type="submit" class="btn w-100" style="margin-top: 1.5rem;">Crear Cuenta</button>
            
        </form>

        <!-- Enlace para regresar al inicio de sesión -->
        <a href="login_Paciente.html" class="back-link">¿Ya tienes una cuenta? Iniciar Sesión</a>

    </main>

    <!-------------------------------------------------------------->

    <footer id="footer-container" data-include="footer.html"></footer>

    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            // 1. Capturamos los valores ingresados por el usuario usando el ID de cada input
            const datosUsuario = {
                nombre: document.getElementById('name').value,
                dni: document.getElementById('dni').value,
                telefono: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                usuario: document.getElementById('username').value,
                nacimiento: document.getElementById('birthdate').value
            };

            // 2. Los guardamos en el localStorage convirtiéndolos a texto JSON
            localStorage.setItem('usuarioRegistrado', JSON.stringify(datosUsuario));
        });
    </script>

    </body>
</html>
