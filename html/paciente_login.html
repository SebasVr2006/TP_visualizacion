<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intranet - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>

    <header id="header-container" data-include="header.html"></header>

    <main class="container">
        <div class="login-card">
            <div class="text-center" style="margin-bottom: 2rem">
                <h1 style="color: var(--primary); font-size: 1.8rem">KineVital</h1>
                <p style="color: var(--gray); font-size: 0.9rem; margin-top: 0.3rem">Portal Pacientes</p>
            </div>

            <form action="paciente_perfil.html" method="GET">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej: admin123 o med_gomez" />
                </div>

                <div class="form-group" style="margin-bottom: 2rem">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" />
                </div>

                <button type="submit" class="btn w-100">Iniciar Sesión</button>
            </form>

            <button type="button" class="btn w-100 btn-registro"><a href="paciente_registro.html">Registro</a></button>

        </div>
    </main>

    <footer id="footer-container" data-include="footer.html"></footer>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</body>

</html>
